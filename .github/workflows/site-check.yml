name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  site-check:
    name: site-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static experiences and disabled booking
        run: node --test tests/experience-booking.test.mjs tests/experiences.test.mjs tests/booking-release.test.mjs
